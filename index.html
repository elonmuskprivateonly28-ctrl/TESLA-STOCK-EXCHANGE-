<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tesla Investor & Model Portal</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <style>
        :root {
            --tesla-red: #e82127;
            --dark-bg: #111111;
            --card-bg: #1c1c1e;
            --text-main: #f5f5f7;
            --text-muted: #8e8e93;
            --border-color: #2c2c2e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--text-main);
            line-height: 1.6;
            padding-bottom: 60px;
        }

        /* Navigation */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 4%;
            background-color: rgba(17, 17, 17, 0.95);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border-color);
        }

        .logo {
            font-weight: 700;
            font-size: 1.5rem;
            letter-spacing: 2px;
            color: var(--text-main);
        }

        .logo span {
            color: var(--tesla-red);
        }

        .nav-links a {
            color: var(--text-main);
            text-decoration: none;
            margin-left: 20px;
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--tesla-red);
        }

        /* Container & Layout */
        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 40px;
        }

        @media (min-width: 900px) {
            .grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        /* Cards styling */
        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 30px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        h2 {
            font-size: 1.8rem;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }

        h2 i {
            color: var(--tesla-red);
        }

        /* Form elements */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-muted);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        select, input {
            width: 100%;
            padding: 14px;
            background-color: #2c2c2e;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        select:focus, input:focus {
            border-color: var(--tesla-red);
        }

        .radio-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .radio-btn {
            position: relative;
        }

        .radio-btn input {
            display: none;
        }

        .radio-btn label {
            display: block;
            background-color: #2c2c2e;
            padding: 12px;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.3s;
            color: var(--text-main);
        }

        .radio-btn input:checked + label {
            border-color: var(--tesla-red);
            background-color: rgba(232, 33, 39, 0.1);
            color: var(--tesla-red);
            font-weight: 600;
        }

        /* Price Display */
        .price-display {
            background-color: #2c2c2e;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            margin-top: 25px;
        }

        .price-val {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 5px;
        }

        .est-lease {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* Portfolio Tracker */
        .portfolio-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-box {
            background-color: #2c2c2e;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
        }

        .stat-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .stat-val {
            font-size: 1.4rem;
            font-weight: 600;
            margin-top: 5px;
        }

        .positive { color: #34c759; }
        .negative { color: #ff3b30; }

        .btn {
            background-color: var(--tesla-red);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            width: 100%;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .btn:hover {
            background-color: #b81418;
        }

        .btn-secondary {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            margin-top: 10px;
        }

        .btn-secondary:hover {
            background-color: #2c2c2e;
        }

        /* Asset list */
        .holdings-list {
            margin-top: 20px;
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
        }

        .holding-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #2c2c2e;
        }

        .holding-meta h4 {
            font-size: 1rem;
        }
        .holding-meta p {
            font-size: 0.8rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">TESLA<span>•</span>PORTAL</div>
        <div class="nav-links">
            <a href="#estimator"><i class="fa-solid fa-car"></i> Configurator</a>
            <a href="#portfolio"><i class="fa-solid fa-chart-line"></i> Portfolio</a>
        </div>
    </nav>

    <div class="container grid">
        
        <!-- SECTION 1: MODEL PRICE ESTIMATOR -->
        <div class="card" id="estimator">
            <h2><i class="fa-solid fa-car-side"></i> Model Price Calculator</h2>
            
            <div class="form-group">
                <label for="modelSelect">Select Vehicle</label>
                <select id="modelSelect" onchange="calculatePrice()">
                    <option value="model3">Model 3 (Base: $36,990)</option>
                    <option value="modely">Model Y (Base: $39,990)</option>
                    <option value="models">Model S (Premium: $111,380)</option>
                    <option value="modelx">Model X (Premium: $116,380)</option>
                    <option value="cybertruck">Cybertruck (Base: $69,990)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Trim Level</label>
                <div class="radio-group">
                    <div class="radio-btn">
                        <input type="radio" id="trimBase" name="trim" value="base" checked onchange="calculatePrice()">
                        <label for="trimBase">Standard / RWD</label>
                    </div>
                    <div class="radio-btn">
                        <input type="radio" id="trimPerf" name="trim" value="perf" onchange="calculatePrice()">
                        <label for="trimPerf">Performance / Plaid</label>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label>Autopilot Options</label>
                <div class="radio-group">
                    <div class="radio-btn">
                        <input type="radio" id="apBasic" name="autopilot" value="basic" checked onchange="calculatePrice()">
                        <label for="apBasic">Basic AP (Incl.)</label>
                    </div>
                    <div class="radio-btn">
                        <input type="radio" id="apFsd" name="autopilot" value="fsd" onchange="calculatePrice()">
                        <label for="apFsd">Full Self-Driving (+$8k)</label>
                    </div>
                </div>
            </div>

            <div class="price-display">
                <div class="stat-label">Estimated Purchase Price</div>
                <div class="price-val" id="totalPrice">$0</div>
                <div class="est-lease" id="monthlyLease">Est. Lease: $0 / mo</div>
            </div>
        </div>

        <!-- SECTION 2: TSLA INVESTMENT PORTFOLIO -->
        <div class="card" id="portfolio">
            <h2><i class="fa-solid fa-wallet"></i> TSLA Investment Portfolio</h2>
            
            <div class="portfolio-stats">
                <div class="stat-box">
                    <div class="stat-label">Total Value</div>
                    <div class="stat-val" id="portfolioValue">$0.00</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Total Return</div>
                    <div class="stat-val positive" id="portfolioReturn">+$0.00 (0%)</div>
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px;">
                <div class="form-group" style="margin-bottom:0;">
                    <label for="sharesInput">Shares Owned</label>
                    <input type="number" id="sharesInput" placeholder="e.g. 10" value="15" min="0">
                </div>
                <div class="form-group" style="margin-bottom:0;">
                    <label for="avgCostInput">Avg Cost Per Share</label>
                    <input type="number" id="avgCostInput" placeholder="e.g. 180" value="165" min="0">
                </div>
            </div>

            <button class="btn" onclick="updatePortfolio()">Recalculate Portfolio</button>
            
            <div class="holdings-list">
                <div class="holding-item">
                    <div class="holding-meta">
                        <h4>TSLA (Tesla, Inc.)</h4>
                        <p id="shareMetaDisplay">15 Shares @ $165.00</p>
                    </div>
                    <div style="text-align: right;">
                        <h4 id="tickerPriceDisplay">$182.50</h4>
                        <p class="holding-meta" style="font-size:0.8rem; color:var(--text-muted);">Simulated Live Price</p>
                    </div>
                </div>
            </div>
            <button class="btn btn-secondary" onclick="simulateMarketFluctuation()"><i class="fa-solid fa-arrows-rotate"></i> Simulate Market Tick</button>
        </div>

    </div>

    <script>
        // True 2026 Baseline Pricing Data
        const basePrices = {
            model3: { base: 36990, perf: 54990 },
            modely: { base: 39990, perf: 57990 }, // Reflects May 2026 adjustments
            models: { base: 111380, perf: 126380 }, // Mid-2026 closeout final run price
            modelx: { base: 116380, perf: 131380 }, 
            cybertruck: { base: 69990, perf: 99990 }
        };
        const fsdPrice = 8000;
        let currentTslaPrice = 182.50; 

        function calculatePrice() {
            const model = document.getElementById('modelSelect').value;
            const trim = document.querySelector('input[name="trim"]:checked').value;
            const autopilot = document.querySelector('input[name="autopilot"]:checked').value;

            let finalPrice = basePrices[model][trim];
            if (autopilot === 'fsd') finalPrice += fsdPrice;

            const estLease = Math.round((finalPrice * 0.011));

            document.getElementById('totalPrice').innerText = new Intl.NumberFormat('en-US', {
                style: 'currency', currency: 'USD', maximumFractionDigits: 0
            }).format(finalPrice);

            document.getElementById('monthlyLease').innerText = `Est. Financing: ~$${estLease} / mo`;
        }

        function updatePortfolio() {
            const shares = parseFloat(document.getElementById('sharesInput').value) || 0;
            const avgCost = parseFloat(document.getElementById('avgCostInput').value) || 0;

            const totalCost = shares * avgCost;
            const currentTotalValue = shares * currentTslaPrice;
            const totalReturn = currentTotalValue - totalCost;
            
            let returnPercentage = 0;
            if(totalCost > 0) returnPercentage = (totalReturn / totalCost) * 100;

            const formatter = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' });
            
            document.getElementById('portfolioValue').innerText = formatter.format(currentTotalValue);
            document.getElementById('shareMetaDisplay').innerText = `${shares} Shares @ ${formatter.format(avgCost)}`;
            document.getElementById('tickerPriceDisplay').innerText = formatter.format(currentTslaPrice);

            const returnElement = document.getElementById('portfolioReturn');
            const sign = totalReturn >= 0 ? '+' : '';
            returnElement.innerText = `${sign}${formatter.format(totalReturn)} (${sign}${returnPercentage.toFixed(2)}%)`;

            returnElement.className = totalReturn >= 0 ? "stat-val positive" : "stat-val negative";
        }

        function simulateMarketFluctuation() {
            const changePercent = (Math.random() * 6.5 - 3) / 100;
            currentTslaPrice = currentTslaPrice * (1 + changePercent);
            updatePortfolio();
        }

        window.onload = function() {
            calculatePrice();
            updatePortfolio();
        };
    </script>
</body>
</html>
